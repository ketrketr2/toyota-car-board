<title>CAR×AI SIGNAL ROOM</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=JetBrains+Mono:wght@500;700;800&display=swap">
<style>
:root{
--bg:#060709;--sf:#0B0D11;--sf2:#10131A;--hl:#1B1F27;--hl2:#2A3140;
--tx:#F4F6FA;--mu:#A7B2C2;--fa:#6E7A8E;
--ac:#6C9EFF;--ac2:#9DBEFF;--acdim:rgba(108,158,255,.14);
--up:#3FD98F;--dn:#FF5C7A;--wa:#FFC24D;
--mono:'JetBrains Mono',ui-monospace,monospace;
--body:'BIZ UDPGothic','BIZ UDGothic','Hiragino Sans',Meiryo,sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html{overflow-x:hidden}
body{background:var(--bg);color:var(--tx);font-family:var(--body);font-size:14px;line-height:1.75;-webkit-font-smoothing:antialiased}
a{color:var(--ac)}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
::selection{background:rgba(108,158,255,.3)}
button{font-family:var(--body);cursor:pointer;color:inherit}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
mark{background:var(--acdim);color:var(--ac2);padding:0 3px;border-radius:3px}

.top{position:sticky;top:0;z-index:40;background:rgba(6,7,9,.88);backdrop-filter:blur(10px);border-bottom:1px solid var(--hl)}
.topin{max-width:1280px;margin:0 auto;padding:0 22px;height:62px;display:flex;align-items:center;gap:16px}
.logo{display:flex;align-items:baseline;gap:9px;white-space:nowrap;cursor:pointer}
.pass{font-size:9px;color:var(--fa);margin-left:4px;white-space:nowrap}
.logo .dot{width:8px;height:8px;border-radius:50%;background:var(--ac);box-shadow:0 0 10px var(--ac);display:inline-block;animation:pulse 2.6s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}
.logo b{font-size:14.5px;letter-spacing:.05em}
.logo span{font-family:var(--mono);font-size:9.5px;color:var(--fa);letter-spacing:.18em}
@media(max-width:1540px){.meta{display:none}.logo span{display:none}}
.meta{margin-left:auto;font-family:var(--mono);font-size:9.5px;color:var(--fa);letter-spacing:.05em;white-space:nowrap}
.meta b{color:var(--mu);font-weight:500}
.tabs{display:flex;gap:5px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{background:none;border:1px solid var(--hl);border-radius:9px;color:var(--mu);font-size:12.5px;font-weight:700;padding:7px 12px;letter-spacing:.02em;transition:all .18s;white-space:nowrap}
.tab:hover{color:var(--tx);border-color:var(--hl2)}
.tab.on{color:var(--ac2);background:var(--acdim);border-color:rgba(108,158,255,.55);box-shadow:0 0 0 1px rgba(108,158,255,.2) inset}
.tab .k{font-family:var(--mono);font-size:8.5px;color:var(--ac);margin-right:5px}

.wrap{max-width:1280px;margin:0 auto;padding:24px 22px 90px}
.view{display:none}
.view.on{display:block;animation:vin .28s ease}
@keyframes vin{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){.view.on,.logo .dot{animation:none}*{transition:none!important}}
.grid{display:grid;gap:14px}
.grid>*{min-width:0}
.c2{grid-template-columns:1fr 1fr}
.c3{grid-template-columns:repeat(3,1fr)}
.c32{grid-template-columns:1.55fr 1fr}
.c23{grid-template-columns:1fr 1.55fr}
@media(max-width:900px){.c2,.c3,.c32,.c23{grid-template-columns:1fr}.topin{flex-wrap:wrap;height:auto;padding:9px 14px}.meta{display:none}}

.card{background:var(--sf);border:1px solid var(--hl);border-radius:13px;padding:18px 20px;transition:border-color .18s}
.card:hover{border-color:var(--hl2)}
.card h3{font-size:12px;color:var(--mu);font-weight:700;letter-spacing:.08em;margin-bottom:3px}
.card .sub{font-size:11px;color:var(--fa);margin-bottom:12px;line-height:1.6}
.sec{margin:28px 0 12px;display:flex;align-items:baseline;gap:12px}
.sec h2{font-size:15px;letter-spacing:.04em}
.sec .ln{flex:1;height:1px;background:var(--hl)}
.sec .tag{font-family:var(--mono);font-size:9px;color:var(--fa);letter-spacing:.12em;text-align:right}

/* hero */
.hero{display:grid;grid-template-columns:auto 1fr;gap:34px;align-items:end;padding:22px 0 22px}
@media(max-width:900px){.hero{grid-template-columns:1fr;gap:16px}}
.hero .big{font-family:var(--mono);font-size:80px;font-weight:800;line-height:.95;letter-spacing:-.02em}
.hero .big small{font-size:28px;color:var(--mu);font-weight:700}
.hero .cap{font-size:12px;color:var(--mu);margin-top:10px;max-width:460px}
.hero .cap b{color:var(--tx)}
.hstats{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--hl);border:1px solid var(--hl);border-radius:12px;overflow:hidden}
@media(max-width:900px){.hstats{grid-template-columns:repeat(2,1fr)}}
.hs{background:var(--sf);padding:13px 15px}
.hs .v{font-family:var(--mono);font-size:22px;font-weight:800}
.hs .v small{font-size:10.5px;color:var(--fa);font-weight:500;margin-left:2px}
.hs .l{font-size:10.5px;color:var(--fa);letter-spacing:.06em;margin-top:2px}
.hs .d{font-size:9.5px;margin-top:2px;color:var(--fa)}

/* hero panels */
.heroP{display:grid;grid-template-columns:280px 280px 1fr;gap:12px;margin-top:14px}
.heroP>*{min-width:0}
@media(max-width:1100px){.heroP{grid-template-columns:1fr 1fr}.hpwide{grid-column:1/-1}}
@media(max-width:700px){.heroP{grid-template-columns:1fr}}
.hp{cursor:pointer;text-align:left;transition:all .18s}
.hp:hover{border-color:var(--ac);transform:translateY(-2px)}
.hpfoot{display:flex;justify-content:center;gap:16px;font-size:11.5px;color:var(--mu);margin-top:10px;flex-wrap:wrap}
.hpfoot .num{color:var(--tx)}
.lg{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;vertical-align:-1px}
/* toolbar */
.tbar{margin-left:auto;display:flex;align-items:center;gap:8px;white-space:nowrap}
.upd{font-family:var(--mono);font-size:10px;color:var(--fa);letter-spacing:.05em}
#gsearch{background:var(--sf2);border:1px solid var(--hl2);border-radius:8px;color:var(--tx);font-size:12px;padding:6px 11px;width:168px;font-family:var(--body)}
#gsearch::placeholder{color:var(--fa)}
.tbtn{width:33px;height:33px;border:1px solid var(--hl2);border-radius:8px;background:var(--sf2);color:var(--mu);font-size:14px}
.tbtn:hover{color:var(--tx);border-color:var(--ac)}
@media(max-width:1380px){.upd{display:none}}
@media(max-width:1180px){#gsearch{width:110px}}
/* light theme */
body.light{--bg:#EEF1F6;--sf:#FFFFFF;--sf2:#F4F6FA;--hl:#DFE4EC;--hl2:#C2CBD8;--tx:#141B28;--mu:#3D4A5E;--fa:#71809A;--ac:#2E5FD0;--ac2:#234CB0;--acdim:rgba(46,95,208,.10);--up:#0C9A5F;--dn:#D22B55;--wa:#8A6200}
body.light .top{background:rgba(255,255,255,.92)}
body.light svg text[fill="#F4F6FA"]{fill:#141B28}
body.light svg text[fill="#C7CFDC"]{fill:#2A3547}
body.light svg text[fill="#EAF1FB"]{fill:#141B28}
body.light svg text[fill="#98A2B3"]{fill:#445062}
body.light svg [stroke="#1B1F27"]{stroke:#DFE4EC}
body.light svg [stroke="#2A3140"]{stroke:#C2CBD8}
body.light svg [stroke="#1E2C46"]{stroke:#D5DCE6}
body.light svg [fill="#0D1626"],body.light svg [fill="#111A2C"],body.light svg [fill="#152037"],body.light svg [fill="#0b1424"],body.light svg [fill="#0C1424"]{fill:#F0F3F8}
body.light .ans{color:#2A3547}
body.light .modal,body.light .drawer{background:#FFFFFF}
body.light .tt{background:#fff;border-color:#C2CBD8;color:#3D4A5E}
body.light .imgw,body.light .carimgbig{background:linear-gradient(180deg,#FAFBFC,#EDF0F4)}
/* print */
/* ===== ホバー強化: クリッカブル要素の明示 ===== */
.hov,.clicky,.jump,.st,.cs,.dtab,.tab,.qmark,th[data-k]{cursor:pointer}
.fb tr.hov:hover td,.t tr.hov:hover td{background:var(--acdim)}
.fb tr.hov:hover td:first-child,.t tr.hov:hover td:first-child{box-shadow:inset 3px 0 0 var(--ac)}
.jump{transition:all .15s}
tr.hov:hover .jump,.jump:hover{background:var(--acdim);border-color:var(--ac);color:var(--ac2);transform:translateY(-1px)}
.clicky:hover{filter:none;background:var(--acdim);box-shadow:inset 0 0 0 1px var(--ac);border-radius:8px}
.st,.cs{transition:all .15s}
.st:hover{border-color:var(--ac);transform:translateY(-1px)}
.cs:hover{border-color:var(--ac);color:var(--tx);transform:translateY(-1px)}
.dtab:hover{border-color:var(--ac);color:var(--tx)}
.tab:hover{color:var(--tx);border-color:var(--ac);background:var(--acdim)}
.hp:hover{border-color:var(--ac);transform:translateY(-2px);box-shadow:0 10px 26px rgba(0,0,0,.30)}
.cg:hover{border-color:var(--ac);transform:translateY(-3px);box-shadow:0 12px 30px rgba(0,0,0,.30)}
th[data-k]:hover{color:var(--ac2)}
.logo:hover b{color:var(--ac2)}
@media print{
 body{--bg:#fff;--sf:#fff;--sf2:#f6f7f9;--hl:#d8dde5;--hl2:#b9c2cf;--tx:#111621;--mu:#2E3947;--fa:#5A6678;background:#fff}
 .top{position:static;background:#fff}
 .tabs,.tbar,.st .ic,.al .arw,.qmark{display:none!important}
 .card,.al,.hp{break-inside:avoid;box-shadow:none}
 svg text[fill="#F4F6FA"]{fill:#111}svg text[fill="#C7CFDC"]{fill:#222}svg text[fill="#98A2B3"]{fill:#3a4452}
 svg [stroke="#1B1F27"]{stroke:#d8dde5}svg [stroke="#2A3140"]{stroke:#b9c2cf}
}
/* status board */
.statusbar{display:grid;gap:1px;background:var(--hl);border:1px solid var(--hl);border-radius:12px;overflow:hidden;margin:14px 0 0}
.sb-main{grid-template-columns:repeat(4,1fr)}
.sb-sub{grid-template-columns:repeat(5,1fr);margin-top:8px}
.sb-sub .st{padding:8px 12px}
.stbig{padding:14px 16px}
.stbig .v{font-size:27px}
.st .d2{font-size:9.5px;color:var(--fa);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media(max-width:1000px){.sb-main{grid-template-columns:repeat(2,1fr)}.sb-sub{grid-template-columns:repeat(3,1fr)}}
@media(max-width:1000px){.statusbar{grid-template-columns:repeat(3,1fr)}}
@media(max-width:640px){.statusbar{grid-template-columns:repeat(2,1fr)}}
.st{background:var(--sf);padding:10px 13px;text-align:left;border:none;cursor:pointer;transition:background .15s;position:relative}
.st:hover{background:var(--sf2)}
.st{min-width:0}
.st .v{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st .v{font-family:var(--mono);font-size:19px;font-weight:800;line-height:1.15}
.st .v small{font-size:10px;color:var(--fa);font-weight:500;margin-left:1px}
.st .l{font-size:10px;color:var(--fa);letter-spacing:.05em;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st .ic{position:absolute;top:8px;right:9px;font-size:8.5px;color:var(--fa);font-family:var(--mono)}
.st:hover .ic{color:var(--ac)}
/* alerts */
.alerts{border:1px solid var(--hl);border-radius:12px;overflow:hidden;margin-top:10px}
.al{display:grid;grid-template-columns:82px 1fr auto auto;gap:12px;align-items:center;background:var(--sf);border:none;border-bottom:1px solid var(--hl);padding:9px 14px;width:100%;text-align:left;cursor:pointer;transition:background .15s}
.al:last-child{border-bottom:none}
.al:hover{background:var(--sf2)}
.al>*{min-width:0}
.al .sev{font-family:var(--mono);font-size:8.5px;letter-spacing:.1em;padding:2px 0;text-align:center;border-radius:5px;border:1px solid}
.sev.crit{color:var(--dn);border-color:rgba(255,92,122,.5);background:rgba(255,92,122,.07)}
.sev.warn{color:var(--wa);border-color:rgba(255,194,77,.45);background:rgba(255,194,77,.06)}
.sev.info{color:var(--ac2);border-color:rgba(108,158,255,.4);background:rgba(108,158,255,.06)}
.al .msg{font-size:13px;color:var(--tx)}
.al .msg small{color:var(--fa);font-size:10.5px;display:block}
.al .evd{font-family:var(--mono);font-size:12px;font-weight:700;color:var(--ac2);white-space:nowrap}
.al .arw{color:var(--fa);font-family:var(--mono);font-size:10px}
/* help + modal */
.qmark{display:inline-flex;align-items:center;justify-content:center;width:17px;height:17px;border-radius:50%;border:1px solid var(--hl2);background:none;color:var(--fa);font-size:10px;font-family:var(--mono);line-height:1;vertical-align:middle;margin-left:7px;flex-shrink:0;cursor:pointer}
.qmark:hover{color:var(--ac);border-color:var(--ac)}
.modal-shade{position:fixed;inset:0;background:rgba(3,4,6,.65);z-index:80;display:none;align-items:flex-start;justify-content:center;padding:7vh 16px 16px;overflow-y:auto}
.modal-shade.on{display:flex}
.modal{background:#0B0E14;border:1px solid var(--hl2);border-radius:14px;max-width:640px;width:100%;box-shadow:0 24px 70px rgba(0,0,0,.6);animation:min .18s ease}
@keyframes min{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.modal .mh{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--hl)}
.modal .mh h4{font-size:13.5px;flex:1}
.modal .mh .mx{background:var(--sf2);border:1px solid var(--hl2);border-radius:7px;color:var(--mu);width:26px;height:26px;font-size:12px}
.modal .mh .mx:hover{color:var(--tx);border-color:var(--ac)}
.modal .mb{padding:15px 18px 18px;font-size:12.5px;color:var(--mu);line-height:1.9}
.modal .mb b{color:var(--tx)}
.modal .mb .def{background:var(--sf);border:1px solid var(--hl);border-radius:10px;padding:10px 13px;margin:9px 0;font-size:12px}
.modal .mb .def .dh{font-family:var(--mono);font-size:9px;color:var(--ac);letter-spacing:.14em;display:block;margin-bottom:3px}
.modal .mb table{margin-top:6px}
.jump{display:inline-block;margin-top:11px;background:var(--acdim);border:1px solid rgba(108,158,255,.4);border-radius:8px;color:var(--ac2);font-size:11.5px;padding:6px 13px}
.jump:hover{border-color:var(--ac)}
.clicky{cursor:pointer}
.clicky:hover{filter:brightness(1.15)}
/* findings */
.finds{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media(max-width:1000px){.finds{grid-template-columns:1fr 1fr}}
@media(max-width:700px){.finds{grid-template-columns:1fr}}
.find{background:var(--sf);border:1px solid var(--hl);border-radius:13px;padding:16px 18px;cursor:pointer;text-align:left;transition:all .18s;display:flex;flex-direction:column;gap:8px}
.find:hover{border-color:var(--ac);transform:translateY(-2px)}
.find .no{font-family:var(--mono);font-size:9px;color:var(--ac);letter-spacing:.16em}
.find h4{font-size:13.5px;line-height:1.55;color:var(--tx)}
.find p{font-size:11px;color:var(--mu);line-height:1.7;flex:1}
.find .go{font-size:10px;color:var(--ac);font-family:var(--mono)}
.find .ev{font-family:var(--mono);font-size:16px;font-weight:800;color:var(--ac2)}
.find .ev small{font-size:9.5px;color:var(--fa);font-weight:400;font-family:var(--body)}

/* funnel board */
.fb{width:100%;border-collapse:collapse;font-size:12px}
.fb th{font-size:10px;color:var(--fa);text-align:left;padding:8px;border-bottom:1px solid var(--hl);letter-spacing:.08em;white-space:nowrap;cursor:pointer}
.fb th:hover{color:var(--tx)}
.fb th.on{color:var(--ac)}
.fb td{padding:8px;border-bottom:1px solid rgba(27,31,39,.6);white-space:nowrap;vertical-align:middle}
.fb tr.hov{cursor:pointer}
.fb tr.hov:hover td{background:rgba(108,158,255,.05)}
.carcell{display:flex;align-items:center;gap:10px}
.thumb{width:64px;height:42px;border-radius:7px;background:#ECEDEF;object-fit:cover;flex-shrink:0;border:1px solid var(--hl2)}
.mono-thumb{width:64px;height:42px;border-radius:7px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:15px;font-weight:800;border:1px solid var(--hl2)}
.carcell .nm{font-size:12px;font-weight:700}
.carcell .sg{font-size:9px;color:var(--fa)}
.fcell{position:relative;min-width:86px}
.fcell .fbar{height:5px;border-radius:3px;background:var(--hl);position:relative;overflow:visible;margin-top:3px;width:80px}
.fcell .fbar i{position:absolute;left:0;top:0;bottom:0;border-radius:3px}
.fcell .fbar em{position:absolute;left:50%;top:-2px;bottom:-2px;width:1px;background:var(--hl2)}
.fcell .fv{font-family:var(--mono);font-size:11.5px;font-weight:700}
.bneck{box-shadow:inset 0 0 0 1.5px var(--dn);border-radius:9px}
.bpill{display:inline-block;font-family:var(--mono);font-size:9px;padding:1px 8px;border-radius:99px;border:1px solid rgba(255,92,122,.55);color:var(--dn)}

/* car grid */
.cargrid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
@media(max-width:1000px){.cargrid{grid-template-columns:repeat(2,1fr)}}
.cg{background:var(--sf);border:1px solid var(--hl);border-radius:13px;overflow:hidden;cursor:pointer;text-align:left;transition:all .18s}
.cg:hover{border-color:var(--ac);transform:translateY(-3px)}
.cg .imgw{background:linear-gradient(180deg,#F2F3F5,#E4E6EA);height:118px;display:flex;align-items:center;justify-content:center;overflow:hidden}
.cg .imgw img{width:88%;height:auto;object-fit:contain;max-height:112px}
.cg .bd{padding:11px 13px 12px}
.cg .nm{font-size:12.5px;font-weight:700}
.cg .sg{font-size:9px;color:var(--fa);margin-bottom:7px}
.cg .row{display:flex;justify-content:space-between;align-items:baseline;font-size:9.5px;color:var(--fa)}
.cg .row .num{font-size:12px;color:var(--tx);font-weight:700}
.cg .kb{height:4px;border-radius:2px;background:var(--hl);margin-top:7px;position:relative}
.cg .kb i{position:absolute;top:0;bottom:0;left:0;border-radius:2px}
.cg .kb em{position:absolute;top:-2px;bottom:-2px;left:50%;width:1px;background:var(--hl2)}

/* insight strip */
.insight{border-left:2px solid var(--ac);padding:10px 14px;background:var(--sf);border-radius:0 10px 10px 0;font-size:12.5px;color:var(--mu);margin-top:12px}
.insight b{color:var(--tx)}
.insight .h{font-family:var(--mono);font-size:9px;color:var(--ac);letter-spacing:.16em;display:block;margin-bottom:3px}
.warnb{border-left-color:var(--dn)}
.warnb .h{color:var(--dn)}

/* generic table */
table.t{width:100%;border-collapse:collapse;font-size:12.5px}
.t th{font-size:10px;color:var(--fa);text-align:left;padding:7px 8px;border-bottom:1px solid var(--hl);letter-spacing:.08em;white-space:nowrap;cursor:pointer;user-select:none}
.t th:hover{color:var(--mu)}
.t td{padding:7px 8px;border-bottom:1px solid rgba(27,31,39,.6);vertical-align:middle}
.t tr:last-child td{border-bottom:none}
.t tr.hov:hover td{background:rgba(108,158,255,.04)}
.tw{overflow-x:auto}
.chip{display:inline-block;font-family:var(--mono);font-size:9px;padding:1px 7px;border-radius:99px;border:1px solid var(--hl2);color:var(--mu);white-space:nowrap}
.chip.ty{color:var(--ac2);border-color:rgba(108,158,255,.45)}
.dotset{font-family:var(--mono);font-size:10px;letter-spacing:2px}
.dotset b{color:var(--ac)} .dotset s{color:#2A3140;text-decoration:none}

.tt{position:fixed;z-index:99;pointer-events:none;background:#12151cee;border:1px solid var(--hl2);border-radius:9px;padding:9px 12px;font-size:11px;color:var(--mu);max-width:300px;display:none;box-shadow:0 8px 30px rgba(0,0,0,.5)}
.tt b{color:var(--tx)}.tt .num{color:var(--ac2)}
svg text{font-family:var(--body)}
.gline{stroke:var(--hl);stroke-dasharray:2 4;stroke-width:1}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:10px;color:var(--fa);margin-top:10px}
.legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.note{font-size:11px;color:var(--fa);line-height:1.8;margin-top:10px}
.note b{color:var(--mu)}

/* car ops */
.carhead{display:grid;grid-template-columns:290px 1fr;gap:20px;align-items:stretch;margin-bottom:14px}
@media(max-width:900px){.carhead{grid-template-columns:1fr}}

 const cars=DATA.funnel.filter(f=>f.name.includes(q));
 const segs=DATA.segs.filter(s=>s.label.includes(q));

 for(const [pid,d] of Object.entries(DATA.qdetail)){ if((d.q||'').includes(q)){hits.push({pid,q:d.q,cat:DATA.cat_labels[d.cat]||'—'}); if(hits.length>=25) break} }
 openModal('検索結果: '+q, `
 ${cars.length?'<div class="def"><span class="dh">車種</span>'+cars.map(f=>`<button class="jump srch-car" data-car="${f.id}" style="margin:3px 6px 3px 0">${esc(f.name)} →</button>`).join('')+'</div>':''}
 ${segs.length?'<div class="def"><span class="dh">車型</span>'+segs.map(s=>`<button class="jump srch-seg" data-seg="${s.seg}" style="margin:3px 6px 3px 0">${s.label} →</button>`).join('')+'</div>':''}
 ${hits.length?'<div class="def"><span class="dh">質問 '+hits.length+'件（クリックで4面詳細）</span>'+hits.map(x=>`<button class="jump srch-q" data-pid="${x.pid}" style="display:block;width:100%;text-align:left;margin:4px 0;font-size:11.5px">${esc(x.q)} <span class="chip">${esc(x.cat)}</span></button>`).join('')+'</div>':''}
 ${!cars.length&&!segs.length&&!hits.length?'<p style="color:var(--fa)">該当なし。車種名（例: ライズ）や質問の語（例: 雪道）で検索できます。</p>':''}`);
 document.querySelectorAll('.srch-car').forEach(b=>b.addEventListener('click',()=>{closeModal();curCar=b.dataset.car;renderCAR();switchTab('car')}));
 document.querySelectorAll('.srch-seg').forEach(b=>b.addEventListener('click',()=>{closeModal();curSeg=b.dataset.seg;renderSEG();switchTab('seg')}));
 document.querySelectorAll('.srch-q').forEach(b=>b.addEventListener('click',()=>showQueryDetail(b.dataset.pid)));
}

 $('#mtitle').textContent=title; $('#mbody').innerHTML=html; ms.classList.add('on');
 $('#mbody').querySelectorAll('[data-jump]').forEach(b=>b.addEventListener('click',()=>{closeModal();switchTab(b.dataset.jump)}));
}

addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
const HELP = {
 f1:{t:'F1 露出機会',d:'AIが回答を生成した率 × 平均引用数（ノイズドメイン除外）。<b>8車種平均=100の指数</b>。低い＝そもそもAIがこの車の質問で回答・根拠を組み立てにくい。'},
 f2:{t:'F2 車種言及',d:'出現すべき質問群（車名を含まない出現期待クエリ）で、回答に車名が登場した率。<b>指名クエリは分母から除外</b>（出現が自明でファネルが成立しなくなるため）。指数は8車種平均=100。セル内の<b>「通過％」は露出機会のうち実際に言及された割合の実測</b>で、露出機会と言及の差分（どれだけ取りこぼしているか）を直接示す。'},
 f3:{t:'F3 第一想起',d:'言及された回答のうち、全車種中いちばん先に書かれた率。AIの回答は先頭の車が事実上の「推奨」— <b>言及されても2番手では選ばれない</b>。指数は8車種平均=100。セル内の<b>「通過％」は言及のうち首位を取れた割合の実測</b>。'},

 trend:{t:'28日トレンド',d:'日次スキャン（60クエリ）の言及ヒット実測を、<b>直近14日合算 vs その前14日合算</b>で比較した変化率。±8%を上昇/下降の閾値とする。本計測（377クエリ×4AI面）の週次時系列は、car-roundのcron化（バックログ③・月約$330）導入後にこのボードへそのまま載る。'},

 radar:{t:'得意・不得意レーダー',d:'分母=当該車型のカテゴリ別・非指名セル。<b>言及率</b>=回答に登場した率／<b>推奨度（首位率）</b>=言及された回答のうち最初に挙がった率。比較対象はその車型で言及数最大の競合車。データが薄いカテゴリ（3セル未満）は軸から除外。'},

 {no:'FINDING 02', ev:'381 vs 402<small>件</small>', h:'トヨタ公式は、競合公式より引用されていない', p:'引用8,779件のうちトヨタ公式(toyota.jp等)は381件、競合5社の公式は402件。8車種が主役の計測なのに公式引用で負けている。AIの「教科書」をメディアと競合に握られている状態。', go:'cite', gol:'引用インテルで見る'},
 {no:'FINDING 03', ev:'0<small>セル</small>', h:'ヴェルファイア、AIの中で消える', p:'ラージミニバン152セルでヴェルファイアが単独で挙がった回答はゼロ（アルファード単独は26）。AIにとって「アルヴェル」はアルファードの別名になっており、ヴェルファイア指名検討層への回路が閉じている。', go:'seg', gol:'車型ウォーズで見る'},

function geoScoreAll(){
 let tm=0, am=0, tf=0, af=0;
 for(const s of DATA.segs){
  for(const r of s.rows){ am+=r.mentions; af+=r.firsts; if(r.brand==='toyota'){tm+=r.mentions; tf+=r.firsts} }
 }
 return {sov:100*tm/am, fsov:100*tf/af, score: Math.round((100*tm/am + 100*tf/af)/2)};
}
function trendOfSeries(t){const n=t.length;const a=t.slice(Math.max(0,n-14)).reduce((x,y)=>x+y,0),b=t.slice(Math.max(0,n-28),Math.max(0,n-14)).reduce((x,y)=>x+y,0);return {a,b,pct:b>0?Math.round(100*(a-b)/b):null}}
function ma7(t){return t.map((_,i)=>t.slice(Math.max(0,i-6),i+1).reduce((x,y)=>x+y,0)/Math.min(i+1,7))}
function trendOf(id){
 const g=DATA.ga.find(x=>x.id===id); if(!g||!g.trend28) return null;
 const t=g.trend28.map(x=>x[1]); const n=t.length;
 const a=t.slice(Math.max(0,n-14)).reduce((x,y)=>x+y,0), b=t.slice(Math.max(0,n-28),Math.max(0,n-14)).reduce((x,y)=>x+y,0);
 return {a,b,pct: b>0? Math.round(100*(a-b)/b): null, series:t};
}
function sparkSvg(series,w,h,color){

 return `<svg viewBox="0 0 ${w} ${h}" style="display:block;width:${w}px;height:${h}px"><polyline points="${pts}" fill="none" stroke="${color}" stroke-width="1.5"/><circle cx="${w}" cy="${h-2-(series[series.length-1]/mx)*(h-5)}" r="2" fill="${color}"/></svg>`;
}

function radarSvg(keys, series, size){
 const cx=size/2, cy=size/2, R=size/2-46, N=keys.length;
 const ang=i=>-Math.PI/2 + i*2*Math.PI/N;
 const pt=(i,r)=>[cx+Math.cos(ang(i))*r, cy+Math.sin(ang(i))*r];
 let s=svgOpen(size,size);
 for(const g of [25,50,75,100]){
  s+=`<polygon points="${keys.map((_,i)=>pt(i,R*g/100).join(',')).join(' ')}" fill="none" stroke="#1B1F27"/>`;
 }
 s+=`<text x="${cx+4}" y="${cy-R-4}" fill="#3A4353" font-size="8.5" font-family="JetBrains Mono">100%</text>`;
 keys.forEach((k,i)=>{
  const [x,y]=pt(i,R); s+=`<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="#1B1F27"/>`;
  const [lx,ly]=pt(i,R+26);
  s+=`<text x="${lx}" y="${ly+3}" text-anchor="middle" fill="#98A2B3" font-size="10">${DATA.cat_labels[k]}</text>`;
 });
 for(const sr of series){
  const pts=keys.map((k,i)=>pt(i,R*Math.min(sr.values[i]??0,100)/100).join(',')).join(' ');
  s+=`<polygon points="${pts}" fill="${sr.color}" fill-opacity="0.13" stroke="${sr.color}" stroke-width="2"/>`;
  keys.forEach((k,i)=>{const [x,y]=pt(i,R*Math.min(sr.values[i]??0,100)/100);s+=`<circle cx="${x}" cy="${y}" r="2.5" fill="${sr.color}"/>`});
 }
 return s+'</svg>';
}

 for(let i=t.length-1;i>=0;i--){ if(t[i]!=null){s+=`<circle cx="${X(i)}" cy="${YT(t[i])}" r="3.5" fill="#6C9EFF"/>`;break}}
 days.forEach((d,i)=>{ if(i%5===0){s+=`<text x="${X(i)}" y="${H-8}" text-anchor="middle" fill="#545E70" font-size="9" font-family="JetBrains Mono">${d.slice(5)}</text>`}
  s+=`<rect class="dd" data-i="${i}" x="${X(i)-((W-P.l-P.r)/(days.length-1))/2}" y="${P.t}" width="${(W-P.l-P.r)/(days.length-1)}" height="${H-P.t-P.b}" fill="transparent"/>`});
 s+='</svg>';
 $('#dualwrap').innerHTML = s + `<div class="legend"><span><i style="background:#6C9EFF"></i>AI言及ヒット（日次スキャン実測）</span><span><i style="background:#545E70"></i>GA4セッション（右軸）</span><span style="color:var(--fa)">GA未計測日は線を引かない</span></div>`;
 document.querySelectorAll('#dualwrap .dd').forEach(r=>{
  const i=+r.dataset.i;
  bindTT(r,()=>`<b>${days[i]}</b><br>AI言及 <span class="num">${t[i]!=null?t[i]+' ヒット':'—'}</span><br>GA <span class="num">${gv[i]!=null?fx(gv[i])+' sess':'—'}</span>`);
 });
}

/* ================= 06 回答リーディング ================= */
const CARLBL = {raize:'ライズ', roomy:'ルーミー', sienta:'シエンタ', voxy:'ヴォクシー'};
function renderREAD(){
 let h = `<div class="sec" style="margin-top:4px"><h2>回答リーディング — 「なぜ選ばれないか」を実物で読む</h2><div class="ln"></div><span class="tag">232万字の在庫から抽出 ／ P0①ドロワーの動作実装</span></div>
 <p style="font-size:12.5px;color:var(--mu);max-width:780px;margin-bottom:14px">実測セルの<b style="color:var(--tx)">実物の回答</b>をそのまま読む。<mark>対象車=青ハイライト</mark>、競合=白太字、引用は役割バッジ付き。本番では車種オペの全クエリ行に接続する。</p>
 <div class="grid c2">`;
 for(const [car,items] of Object.entries(DATA.drawer)){
  for(const it of items){
   const tglab = {absent:'全面で不在',behind:'出るが後塵',win:'第一想起を獲得'}[it.tag];
   const ranks = Object.entries(it.surfaces).map(([s,v])=>{
    const me = v.order.find(o=>o.id===car);
    return `${SUR[s]} ${me?me.rank+'位':'—'}`;
   }).join(' ／ ');
   h += `<button class="card" style="cursor:pointer;text-align:left" data-car="${car}" data-pid="${it.pid}" onmouseover="this.style.borderColor='var(--ac)'" onmouseout="this.style.borderColor=''">
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:9px">${carThumb(car,CARLBL[car],'toyota')}<span class="qc-tag tg-${it.tag}">${tglab} · ${CARLBL[car]}</span></div>
    <p style="font-size:13px;line-height:1.7">${esc(it.q||it.pid)}</p>
    <div class="num" style="font-size:10px;color:var(--fa);margin-top:8px">${ranks}</div></button>`;
  }
 }
 h += `</div>`;
 $('#v-read').innerHTML = h;
 document.querySelectorAll('#v-read [data-pid]').forEach(b=>b.addEventListener('click',()=>openDrawer(b.dataset.car,b.dataset.pid)));
}
let curSur='chatgpt';
function openDrawer(car,pid){
 const it = (DATA.drawer[car]||[]).find(x=>x.pid===pid);
 if(!it) return;
 curSur = Object.keys(it.surfaces)[0];
 const d=$('#drawer');
 d.innerHTML = `<div class="dhead"><button class="dx" id="dx" aria-label="閉じる">✕</button>
  <div class="q">${esc(it.q||pid)}</div><div class="m">${pid} ／ 対象車: ${CARLBL[car]||car} ／ カテゴリ: ${esc(it.category||'—')}</div>
  <div class="dtabs" id="dtabs">${Object.keys(it.surfaces).map(s=>`<button class="dtab ${s===curSur?'on':''}" data-s="${s}">${SUR[s]}</button>`).join('')}</div></div>
  <div class="dbody" id="dbody"></div>`;
 $('#shade').classList.add('on'); d.classList.add('on');
 $('#dx').addEventListener('click',closeDrawer);
 document.querySelectorAll('#dtabs .dtab').forEach(b=>b.addEventListener('click',()=>{curSur=b.dataset.s;document.querySelectorAll('#dtabs .dtab').forEach(x=>x.classList.toggle('on',x===b));drawBody(car,it)}));
 drawBody(car,it);
}
function drawBody(car,it){
 const v = it.surfaces[curSur];
 if(!v){$('#dbody').innerHTML='<div class="note">この面の回答なし</div>';return}
 const own = CARLBL[car];
 let ans = esc(v.answer||'');
 ans = ans.replace(/\[([^\]\n]{1,80})\]\((https?:[^)\s]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
 const rivNames = v.order.filter(o=>o.id!==car).map(o=>o.name).sort((a,b)=>b.length-a.length);
 for(const n of rivNames) ans = ans.split(n).join(`⟬R⟭${n}⟬/R⟭`);
 ans = ans.split(own).join(`⟬O⟭${own}⟬/O⟭`);
 ans = ans.replace(/⟬R⟭/g,'<b class="riv">').replace(/⟬\/R⟭/g,'</b>').replace(/⟬O⟭/g,'<span class="own">').replace(/⟬\/O⟭/g,'</span>');
 const orderHtml = v.order.length? v.order.map(o=>`<span class="oc ${o.id===car?'own':''}">${o.rank}位 ${esc(o.name)}</span>`).join('') : '<span class="oc">検出車種なし（対象車も競合も挙がらず）</span>';
 const cites = (v.cites||[]).map(c=>{
  const label = c.title || c.host || '';
  return `<div class="ci"><span class="bk">${esc(c.bucket||'—')}</span><a href="${esc(c.url||'#')}" target="_blank" rel="noopener">${esc(label)}</a></div>`;
 }).join('') || '<div class="note">引用なし</div>';
 $('#dbody').innerHTML = `<div style="font-size:10px;color:var(--fa);margin-bottom:6px">AIが挙げた候補の並び順（指名除外後）</div>
  <div class="order">${orderHtml}</div>
  <div class="ans">${ans}</div>
  <div class="cites"><div style="font-size:10px;color:var(--fa);margin:10px 0 4px">この回答の引用（保存済み実データ・先頭6件）</div>${cites}</div>`;
}
function closeDrawer(){$('#drawer').classList.remove('on');$('#shade').classList.remove('on')}
$('#shade').addEventListener('click',closeDrawer);
addEventListener('keydown',e=>{if(e.key==='Escape')closeDrawer()});

renderHQ(); renderCAR(); renderSEG(); renderCITE(); renderGA();
</script>
