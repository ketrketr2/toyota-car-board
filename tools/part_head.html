<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>車種別AI分析 — CAR × AI DEEP DIVE</title>
<!--CARAI_BOARD-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=JetBrains+Mono:wght@600;800&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<noscript><link href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=JetBrains+Mono:wght@600;800&display=swap" rel="stylesheet"></noscript>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='24' fill='%23FFB020'/><path d='M20 62 L30 40 Q33 33 41 33 L59 33 Q67 33 70 40 L80 62 Z' fill='%23140F04'/><rect x='16' y='58' width='68' height='14' rx='7' fill='%23140F04'/><circle cx='34' cy='74' r='8' fill='%23140F04' stroke='%23FFB020' stroke-width='4'/><circle cx='66' cy='74' r='8' fill='%23140F04' stroke='%23FFB020' stroke-width='4'/></svg>">
<style>
:root{
 --bg:#080D18; --bg2:#0C1322; --panel:#111A2C; --panel2:#152037; --line:#1E2C46; --line2:#2B3D5E;
 --tx:#EAF1FB; --tx2:#9EB1CD; --tx3:#5F7291;
 --ac:#FFB020; --ac2:#E8920A; --cy:#22C7D6; --gn:#3DDC97; --rd:#FF6B87; --pu:#9B8CFF;
 --mono:'JetBrains Mono',monospace;
}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{overflow-x:hidden;max-width:100%;}
body{background:radial-gradient(1200px 700px at 70% -10%, #14263E 0%, transparent 55%), var(--bg);
 color:var(--tx);font-family:'BIZ UDPGothic','BIZ UDGothic','Hiragino Sans',Meiryo,sans-serif;font-size:14px;min-height:100vh;}
a{color:var(--cy);text-decoration:none;}
.mono{font-family:var(--mono);}
mark{background:linear-gradient(transparent 55%, rgba(255,176,32,.42) 55%);color:inherit;padding:0 2px;border-radius:2px;}
.layout{display:grid;grid-template-columns:236px 1fr;min-height:100vh;}
/* ---- sidebar ---- */
.side{background:linear-gradient(180deg,#0D1626,#0A101D);border-right:1px solid var(--line);padding:22px 14px 18px;position:sticky;top:0;height:100vh;overflow-y:auto;scrollbar-width:thin;}
.logo{display:flex;gap:10px;align-items:center;margin-bottom:6px;padding:0 8px;}
.logo .mk{width:38px;height:38px;border-radius:11px;background:linear-gradient(145deg,var(--ac),var(--ac2));display:grid;place-items:center;box-shadow:0 6px 18px rgba(255,176,32,.3);flex:none;}
.logo h1{font-size:15px;letter-spacing:.04em;line-height:1.25;}
.logo h1 b{color:var(--ac);}
.logo .sub{font-size:9px;color:var(--tx3);letter-spacing:.18em;}
.nav{margin-top:16px;}
.nav .sec{font-size:9px;color:var(--tx3);letter-spacing:.2em;margin:16px 8px 6px;font-weight:700;}
.nv{display:flex;align-items:center;gap:9px;width:100%;padding:9px 10px;border-radius:10px;border:1px solid transparent;background:none;color:var(--tx2);font-family:inherit;font-size:12.5px;cursor:pointer;text-align:left;transition:.14s;}
.nv:hover{background:#121D31;color:var(--tx);}
.nv.on{background:linear-gradient(120deg,rgba(255,176,32,.14),rgba(255,176,32,.05));border-color:rgba(255,176,32,.4);color:var(--tx);font-weight:700;}
.nv .ic{width:17px;text-align:center;flex:none;}
.nv .bd{margin-left:auto;font-family:var(--mono);font-size:10px;padding:2px 7px;border-radius:99px;background:#0b1424;border:1px solid var(--line2);color:var(--tx2);}
.nv .bd.hot{color:var(--rd);border-color:rgba(255,107,135,.5);}
.nv .bd.good{color:var(--gn);border-color:rgba(61,220,151,.45);}
.sfoot{margin-top:22px;padding:12px 10px;border-top:1px dashed var(--line);font-size:10px;color:var(--tx3);line-height:1.9;}
/* ---- main ---- */
.main{padding:22px 28px 60px;min-width:0;}
.crumb{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px;}
.crumb h2{font-size:20px;letter-spacing:.02em;}
.crumb h2 small{font-size:11px;color:var(--tx3);font-weight:400;margin-left:10px;letter-spacing:.1em;}
.chip{font-size:10.5px;color:var(--tx2);background:var(--panel);border:1px solid var(--line);padding:4px 10px;border-radius:99px;}
.chip b{color:var(--ac);font-family:var(--mono);}
.hbtn{margin-left:auto;background:var(--panel);border:1px solid var(--line2);color:var(--cy);border-radius:99px;width:30px;height:30px;font-weight:800;cursor:pointer;font-family:inherit;transition:.14s;}
.hbtn:hover{background:#16233B;transform:scale(1.06);}
/* ---- cards & grids ---- */
.g{display:grid;gap:14px;}
.card{background:linear-gradient(165deg,var(--panel2),var(--panel) 70%);border:1px solid var(--line);border-radius:15px;padding:16px 18px;position:relative;min-width:0;}
.card.hl:before{content:"";position:absolute;inset:0 auto 0 0;width:3px;border-radius:3px 0 0 3px;background:linear-gradient(180deg,var(--ac),transparent);}
.ct{font-size:12px;font-weight:700;color:var(--tx2);letter-spacing:.06em;display:flex;align-items:center;gap:8px;margin-bottom:12px;}
.ct .q{cursor:pointer;color:var(--cy);border:1px solid var(--line2);border-radius:99px;width:17px;height:17px;display:inline-grid;place-items:center;font-size:10px;flex:none;}
.ct .q:hover{background:#16233B;}
.kpi{font-family:var(--mono);font-size:26px;font-weight:800;letter-spacing:-.01em;}
.kpi small{font-size:12px;color:var(--tx3);font-weight:600;margin-left:3px;}
.sub2{font-size:10.5px;color:var(--tx3);margin-top:4px;line-height:1.6;}
.up{color:var(--gn);} .dn{color:var(--rd);} .ac{color:var(--ac);} .cyt{color:var(--cy);}
.tbl{width:100%;border-collapse:collapse;font-size:12px;}
.tbl th{font-size:10px;color:var(--tx3);text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);letter-spacing:.08em;white-space:nowrap;cursor:pointer;user-select:none;}
.tbl th:hover{color:var(--cy);}
.tbl td{padding:8px;border-bottom:1px solid #14203630;vertical-align:top;}
.tbl tr:hover td{background:#12203608;}
.tblwrap{overflow-x:auto;}
.pill{display:inline-block;font-size:9.5px;padding:2px 8px;border-radius:99px;border:1px solid var(--line2);color:var(--tx2);white-space:nowrap;}
.pill.n{color:var(--pu);border-color:rgba(155,140,255,.45);}
.pill.ok{color:var(--gn);border-color:rgba(61,220,151,.5);}
.pill.ng{color:var(--rd);border-color:rgba(255,107,135,.5);}
.pill.ty{color:var(--ac);border-color:rgba(255,176,32,.5);}
.bar{height:8px;border-radius:99px;background:#0b1424;overflow:hidden;}
.bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--ac2),var(--ac));}
/* ---- funnel ---- */
.fun{display:grid;gap:10px;}
.fstage{display:grid;grid-template-columns:118px 1fr 92px;gap:12px;align-items:center;background:#0D1626;border:1px solid var(--line);border-radius:12px;padding:11px 14px;transition:.15s;cursor:pointer;}
.fstage:hover{border-color:var(--line2);transform:translateX(2px);}
.fstage .fl{font-size:11px;color:var(--tx2);font-weight:700;line-height:1.5;}
.fstage .fl small{display:block;color:var(--tx3);font-size:9px;font-weight:400;}
.fstage .fv{font-family:var(--mono);font-size:17px;font-weight:800;text-align:right;}
.fstage .fv small{display:block;font-size:9px;color:var(--tx3);font-weight:400;}
.ibox{border-left:3px solid var(--ac);background:#0D1626;border-radius:0 12px 12px 0;padding:12px 15px;margin-top:8px;}
.ibox h4{font-size:11px;color:var(--ac);letter-spacing:.1em;margin-bottom:6px;}
.ibox p{font-size:12.5px;line-height:1.9;color:var(--tx);}
.ibox.is2{border-color:var(--rd);} .ibox.is2 h4{color:var(--rd);}
.ibox.is3{border-color:var(--gn);} .ibox.is3 h4{color:var(--gn);}
/* ---- modal ---- */
.mback{position:fixed;inset:0;background:rgba(3,7,14,.72);backdrop-filter:blur(3px);display:none;place-items:center;z-index:60;padding:20px;}
.mback.on{display:grid;}
.modal{width:100%;max-width:640px;max-height:82vh;overflow-y:auto;background:linear-gradient(165deg,#16223A,#101A2D);border:1px solid var(--line2);border-radius:16px;padding:24px 26px;box-shadow:0 40px 100px rgba(0,0,0,.6);}
.modal h3{font-size:16px;margin-bottom:12px;color:var(--ac);}
.modal p,.modal li{font-size:12.5px;line-height:2;color:var(--tx2);}
.modal b{color:var(--tx);}
.modal .x{float:right;background:none;border:1px solid var(--line2);color:var(--tx2);border-radius:8px;padding:4px 12px;cursor:pointer;font-family:inherit;}
.tip{position:fixed;z-index:70;background:#1A2740;border:1px solid var(--line2);border-radius:10px;padding:9px 12px;font-size:11px;line-height:1.8;color:var(--tx);max-width:300px;pointer-events:none;display:none;box-shadow:0 14px 40px rgba(0,0,0,.5);}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:10px;color:var(--tx3);margin-top:8px;}
.legend i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:5px;vertical-align:-1px;}
svg text{font-family:'BIZ UDPGothic',sans-serif;}
.fade{animation:fd .35s ease both;}
@keyframes fd{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:none;}}
::-webkit-scrollbar{width:9px;height:9px;} ::-webkit-scrollbar-thumb{background:#22314E;border-radius:99px;}
@media(max-width:980px){
 .layout{grid-template-columns:1fr;}
 .side{position:relative;height:auto;display:block;padding:14px;}
 .nav{display:flex;overflow-x:auto;gap:6px;padding-bottom:6px;}
 .nav .sec{display:none;} .nv{white-space:nowrap;flex:none;}
 .sfoot{display:none;}
 .main{padding:16px 14px 50px;}
}
</style>
</head>
<body>
<div class="layout">
 <aside class="side">
  <div class="logo">
   <div class="mk"><svg width="22" height="22" viewBox="0 0 100 100"><path d="M20 62 L30 40 Q33 33 41 33 L59 33 Q67 33 70 40 L80 62 Z" fill="#140F04"/><rect x="16" y="58" width="68" height="14" rx="7" fill="#140F04"/><circle cx="34" cy="74" r="8" fill="#140F04" stroke="#FFB020" stroke-width="4"/><circle cx="66" cy="74" r="8" fill="#140F04" stroke="#FFB020" stroke-width="4"/></svg></div>
   <h1>車種別<b>AI分析</b><div class="sub">CAR × AI DEEP DIVE</div></h1>
  </div>
  <nav class="nav" id="nav"></nav>
  <div class="sfoot" id="sfoot"></div>
 </aside>
 <main class="main" id="main"></main>
</div>
<div class="mback" id="mback" onclick="if(event.target===this)closeModal()"><div class="modal" id="modal"></div></div>
<div class="tip" id="tip"></div>
